name: AEON WASM module CI

on:
    push:
    pull_request:

env:
    # A fixed version used for testing, so that the builds don't
    # spontaneously break after a few years.
    # Make sure to update this from time to time.
    RUST_VERSION: "1.86.0"

jobs:
    format-check:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: lts/*

            - name: Install dependencies
              run: npm ci

            - uses: dtolnay/rust-toolchain@stable
              with:
                toolchain: ${{ env.RUST_VERSION }}
                components: rustfmt

            - name: Run format check
              run: npm run wasm:format:check

    validity-check:
        runs-on: ubuntu-latest
        needs: format-check
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: lts/*

            - name: Install dependencies
              run: npm ci

            - uses: dtolnay/rust-toolchain@stable
              with:
                toolchain: ${{ env.RUST_VERSION }}
                components: clippy

            - name: Run format check
              run: npm run wasm:build:check

            - name: Run format check
              run: npm run wasm:build:test

    build:
        runs-on: ubuntu-latest
        needs: validity-check
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                node-version: lts/*

            - name: Install dependencies
              run: npm ci

            - uses: dtolnay/rust-toolchain@stable
              with:
                toolchain: ${{ env.RUST_VERSION }}
                components: rustfmt

            - name: Install wasm-pack
              uses: baptiste0928/cargo-install@v3
              with:
                crate: wasm-pack

            - name: Run format check
              run: npm run wasm:build:install
